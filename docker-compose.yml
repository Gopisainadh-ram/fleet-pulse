# Local PostgreSQL only. The API and web app run through Nx.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleetpulse
    ports:
      - '5432:5432'
    volumes:
      - fleetpulse_data:/var/lib/postgresql/data

volumes:
  fleetpulse_data:
